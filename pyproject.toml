[project]
name = "mas-dsmb"
version = "0.1.0"
description = ""
authors = [
    {name = "Filippo Badioli",email = "filippo.badioli@studio.unibo.it"},
    {name = "Gabriele Santi", email "gabriele.santi6@studio.unibo.it"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame (>=2.6.1,<3.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn[standard] (>=0.46.0,<0.47.0)",
    "websockets (>=16.0,<17.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytmx (>=3.32,<4.0)",
    "spade_bdi (>=0.3.3)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
include = ["src/distributed_smb/assets/*/*.png"]

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "ruff (>=0.14.14,<0.15.0)"
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:websockets",
    "ignore::DeprecationWarning:uvicorn",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
