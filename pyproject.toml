[project]
name = "mas-dsmb"
version = "0.1.0"
description = ""
authors = [
    {name = "Filippo Badioli", email = "filippo.badioli@studio.unibo.it"},
    {name = "Gabriele Santi", email = "gabriele.santi6@studio.unibo.it"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame (>=2.6.1,<3.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn[standard] (>=0.46.0,<0.47.0)",
    "websockets (>=16.0,<17.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytmx (>=3.32,<4.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "distributed_smb", from = "src" }
]
include = ["src/distributed_smb/assets/*/*.png"]